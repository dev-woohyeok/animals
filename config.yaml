# Animal Shorts Agent System - Main Configuration

app:
  name: "Animal Shorts Agent System"
  version: "2.0.0"

defaults:
  style: "cinematic_realistic"
  target_scenes: 6
  scene_duration: 15  # seconds
  language:
    prompt: "en"  # Sora2 prompts in English
    ui: "ko"      # UI in Korean

validation:
  min_prompt_length: 50
  max_prompt_length: 500
  min_quality_score: 75

output:
  formats:
    - markdown
    - json
    - clipboard
  default_format: "markdown"

paths:
  projects: "projects"
  library: "library"
  exports: "exports"
