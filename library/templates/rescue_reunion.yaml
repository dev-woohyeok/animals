# Story Template: Rescue & Reunion

id: rescue_reunion
name: "구조 & 재회"
genre: "감동/치유"
description: "버려진/길 잃은 동물이 새 가족을 만나는 이야기"
suggested_animals:
  - dog
  - cat
  - rabbit
  - bird

structure:
  - phase: "도입"
    description: "동물의 고독한 상황 제시"
    beats:
      - "동물이 홀로 있는 모습"
      - "환경의 차가움/위험 암시"
      - "희망을 잃지 않는 눈빛"
    emotion: "슬픔, 고독, 미약한 희망"
    suggested_duration: "1-2 scenes"
    visual_suggestions:
      - "넓은 화면에서 작은 동물"
      - "비/눈 등 날씨 요소"
      - "차가운 색감"

  - phase: "만남"
    description: "인간 캐릭터와의 첫 만남"
    beats:
      - "인간 캐릭터 등장"
      - "첫 눈맞춤의 순간"
      - "호기심과 경계의 교차"
    emotion: "희망의 시작, 긴장"
    suggested_duration: "1-2 scenes"
    visual_suggestions:
      - "시선 교환 클로즈업"
      - "두 캐릭터의 거리감"
      - "조명 변화 시작"

  - phase: "망설임"
    description: "결정을 앞둔 갈등"
    beats:
      - "인간의 내적 갈등"
      - "동물의 기다림"
      - "주변 상황의 압박"
    emotion: "긴장, 불안, 기대"
    suggested_duration: "1 scene"
    visual_suggestions:
      - "손이 뻗어나가는 동작"
      - "망설이는 표정"
      - "시간이 멈춘 듯한 순간"

  - phase: "결심"
    description: "구조를 결정하는 순간"
    beats:
      - "결정의 순간"
      - "첫 접촉"
      - "안도와 따뜻함"
    emotion: "안도, 따뜻함, 기쁨의 시작"
    suggested_duration: "1 scene"
    visual_suggestions:
      - "포옹하는 순간"
      - "따뜻한 조명으로 전환"
      - "배경 흐려짐"

  - phase: "결말"
    description: "새로운 시작"
    beats:
      - "새로운 환경"
      - "행복한 일상"
      - "감정적 마무리"
    emotion: "기쁨, 감동, 따뜻함"
    suggested_duration: "1-2 scenes"
    visual_suggestions:
      - "밝은 공간"
      - "웃는 표정들"
      - "평화로운 일상"

emotional_arc:
  start: 20   # 0-100 scale
  low_point: 10
  turning_point: 50
  climax: 85
  end: 95

visual_motifs:
  - contrast: "어둠에서 밝음으로"
  - weather: "비/눈에서 맑음으로"
  - space: "야외에서 실내로"
  - color: "차가운 색에서 따뜻한 색으로"
