# Prompt Validation Rules

prompt_validation:
  length:
    min: 50
    max: 500
    warning_threshold: 400

  required_elements:
    - id: subject_description
      description: "주체(캐릭터) 설명"
      weight: 0.25
      keywords: []  # 동적으로 체크

    - id: action
      description: "동작/행동 설명"
      weight: 0.20
      keywords: ["sits", "walks", "looks", "runs", "moves", "stands"]

    - id: camera_movement
      description: "카메라 워크"
      weight: 0.20
      keywords: ["dolly", "tracking", "pan", "tilt", "zoom", "static", "close-up", "wide shot", "medium shot"]

    - id: lighting
      description: "조명 설명"
      weight: 0.20
      keywords: ["lighting", "light", "shadows", "backlit", "golden hour", "diffused", "harsh", "soft"]

    - id: atmosphere
      description: "분위기/감정"
      weight: 0.15
      keywords: ["atmosphere", "mood", "melancholic", "joyful", "tense", "peaceful", "hopeful"]

quality_scoring:
  categories:
    specificity:
      weight: 0.30
      description: "구체적 시각 디테일 포함 여부"
      checks:
        - "color descriptions (cream, golden, grey)"
        - "texture descriptions (fluffy, smooth, wet)"
        - "size/proportion descriptions"
      scoring:
        excellent: 90-100  # 3개 이상
        good: 70-89        # 2개
        fair: 50-69        # 1개
        poor: 0-49         # 없음

    sora2_compatibility:
      weight: 0.30
      description: "Sora2 지원 키워드 및 패턴 사용"
      checks:
        - "uses supported camera terms"
        - "specifies duration-appropriate action"
        - "includes atmosphere keywords"
      scoring:
        excellent: 90-100
        good: 70-89
        fair: 50-69
        poor: 0-49

    emotional_clarity:
      weight: 0.20
      description: "감정/분위기 명확성"
      checks:
        - "clear emotional tone"
        - "consistent mood throughout"
        - "appropriate visual metaphors"
      scoring:
        excellent: 90-100
        good: 70-89
        fair: 50-69
        poor: 0-49

    technical_accuracy:
      weight: 0.20
      description: "카메라/조명 기술 용어 정확성"
      checks:
        - "correct camera terminology"
        - "realistic lighting descriptions"
        - "coherent visual composition"
      scoring:
        excellent: 90-100
        good: 70-89
        fair: 50-69
        poor: 0-49

consistency_checks:
  character_match:
    description: "캐릭터 설명 일관성"
    threshold: 0.85
    method: "text_similarity"

  style_consistency:
    description: "스타일/렌더링 일관성"
    threshold: 0.90
    check_elements:
      - "rendering style keywords"
      - "color palette terms"
      - "quality descriptors"

  background_continuity:
    description: "배경 연속성"
    threshold: 0.80
    check_elements:
      - "location terms"
      - "time of day"
      - "weather conditions"

improvement_suggestions:
  low_specificity:
    - "Add more specific color descriptions (e.g., 'cream-colored' instead of 'light')"
    - "Include texture details (e.g., 'fluffy', 'smooth', 'wet')"
    - "Specify size or proportions"

  missing_camera:
    - "Add camera movement (e.g., 'slow dolly shot', 'static wide angle')"
    - "Specify shot type (close-up, medium, wide)"
    - "Include camera transition if applicable"

  missing_lighting:
    - "Describe lighting quality (soft, harsh, diffused)"
    - "Specify light source or direction"
    - "Include shadow information"

  weak_atmosphere:
    - "Add explicit mood keywords (melancholic, hopeful, tense)"
    - "Include environmental atmosphere (cold, warm, cozy)"
    - "Connect visual elements to emotional tone"
